server {
    listen 80;
    server_name _;
    resolver 169.254.169.253 valid=30s;

    location / {
        root /usr/share/nginx/html;
    }

    location /api/ {
        set $api_host "<API-ID>.execute-api.us-east-1.amazonaws.com";

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass https://$api_host;

        proxy_ssl_server_name on;
        proxy_set_header Host $api_host;

        proxy_set_header X-Environment    "dev";
        proxy_set_header X-Student-ID     "<YOUR-STUDENT-ID>";
        proxy_set_header X-Internal-Token $internal_token;  # fetched from SSM at boot
    }
}
